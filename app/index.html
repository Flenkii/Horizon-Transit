<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1220">
<title>Horizon Transit</title>
<!-- Horizon Transit's phone app (0.10). The same page runs in the Android app and in a phone's browser (the mod
     serves it at http://<pc>:8710/). It talks to the mod's little server in the home network: /api/state,
     /api/do, /api/lines, /api/tile. Own code, no libraries. -->
<style>
:root {
  --sel: #fff; --bg2: #0E1220;
  --bg: #0E1220; --panel: #171C2C; --panel2: #1F2538; --line: #2A3148; --text: #F2F4FA; --dim: #9AA3BA; --dim2: #6B7390;
  --a1: #FF2E7E; --a2: #FF8A3D; --good: #36D399; --warn: #FFC542; --bad: #FF4D5E; --blue: #5B9BFF;
  --grad: linear-gradient(90deg, var(--a1), var(--a2));
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: linear-gradient(var(--bg2), var(--bg)) fixed; color: var(--text);
  font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.app { position: fixed; inset: 0; display: flex; flex-direction: column; }
header { padding: calc(10px + var(--safe-t)) 16px 8px; display: flex; align-items: center; gap: 12px; }
.logo { width: 40px; height: 40px; border-radius: 11px; background: var(--grad); display: grid; place-items: center;
  font-weight: 800; font-size: 24px; color: var(--sel); flex: none; }
.title { flex: 1; min-width: 0; }
.title b { display: block; font-size: 18px; }
.title small { color: var(--dim); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.money { font-weight: 700; font-size: 17px; text-align: right; }
.money small { display: block; color: var(--dim); font-weight: 500; font-size: 11px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
.dot.off { background: var(--bad); }
.gap { height: 10px; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
main { flex: 1; position: relative; overflow: hidden; }
/* 0.10.4: without the game: the last state, and what waits for the game */
.offbar { display: none; margin: 0 16px 6px; padding: 8px 12px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; color: var(--dim); }
.offbar.on { display: block; }
.offbar b { color: var(--text); }
.page { position: absolute; inset: 0; overflow-y: auto; padding: 4px 16px 16px; display: none; -webkit-overflow-scrolling: touch; }
.page.on { display: block; }
#p-map { padding: 0; overflow: hidden; }
nav { display: flex; padding: 6px 4px calc(6px + var(--safe-b)); background: var(--navbg, var(--panel)); border-top: 1px solid var(--line); }
nav button { flex: 1; min-width: 0; padding: 6px 0 4px; color: var(--dim); font-size: 10.5px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 3px; }
nav button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav button.on { color: var(--text); }
nav button.on svg { stroke: var(--a1); }
nav button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 0.10.1: options, shop, account */
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-bottom: 1px solid var(--line); }
.opt:last-child { border-bottom: 0; }
.opt .v { flex: none; padding: 5px 11px; border-radius: 99px; background: var(--panel2); font-size: 13px; font-weight: 700; color: var(--text); }
.opt .v.on { background: var(--grad); color: var(--sel); }
.opt small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
.list { padding: 0; overflow: hidden; }
.code-big { font-size: 34px; font-weight: 800; letter-spacing: .25em; text-align: center; margin: 6px 0 2px; }
.ico { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--panel2); flex: none; }
.ico svg { width: 24px; height: 24px; fill: none; stroke: var(--a1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.item.bought { opacity: .8; }
.item.bought .ico { background: var(--grad); }
.item.bought .ico svg { stroke: var(--sel); }
.price { font-weight: 800; font-size: 17px; white-space: nowrap; }
.ok { color: var(--good); font-weight: 700; font-size: 13px; }
.fold { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
.fold i { font-style: normal; color: var(--dim); transition: transform .25s; }
.fold.open i { transform: rotate(90deg); }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.kv span { color: var(--dim); }
.kv:first-child { border-top: 0; }
.card.hero { background: var(--grad); color: var(--sel); border: 0; }
.hero .muted { color: inherit; opacity: .8; }
h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 14px 2px 8px; font-weight: 700; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--dim); font-size: 13px; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pay { font-size: 22px; font-weight: 800; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--panel2); color: var(--dim); margin-right: 4px; }
.tag.hot { background: rgba(255,138,61,.18); color: var(--a2); }
.tag.vip { background: rgba(255,197,66,.16); color: var(--warn); }
.route { margin: 10px 0 12px; position: relative; padding-left: 20px; }
.route::before { content: ""; position: absolute; left: 5px; top: 9px; bottom: 9px; width: 2px; background: var(--line); }
.route div { position: relative; padding: 2px 0; }
.route div::before { content: ""; position: absolute; left: -20px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--good); }
.route div.to::before { background: var(--bad); border-radius: 3px; }
.btn { display: block; width: 100%; padding: 13px; border-radius: 13px; background: var(--grad); color: var(--sel); font-weight: 700; font-size: 15px; text-align: center; }
.btn.ghost { background: var(--panel2); color: var(--text); }
.btn.red { background: rgba(255,77,94,.16); color: var(--bad); }
.btn:active { filter: brightness(1.15); transform: scale(.99); }
.btn[disabled] { opacity: .45; }
.empty { text-align: center; color: var(--dim); padding: 36px 16px; }
.empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
.bar { height: 7px; border-radius: 99px; background: var(--panel2); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--grad); border-radius: 99px; transition: width .4s; }
.bar.q i { background: var(--good); }
.bar.q.mid i { background: var(--warn); }
.bar.q.low i { background: var(--bad); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat b { display: block; font-size: 20px; }
.stat span { color: var(--dim); font-size: 12px; }
/* the job */
.job-top { display: flex; gap: 14px; align-items: center; }
.sign { width: 64px; height: 64px; border-radius: 50%; background: #fff; border: 7px solid #E2232F; color: #111; display: grid; place-items: center;
  font-weight: 800; font-size: 22px; line-height: 1; flex: none; position: relative; }
.sign small { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 8px; font-weight: 700; }
.sign.over { background: var(--warn); animation: flash .5s infinite alternate; }
.sign.over2 { background: var(--bad); color: #fff; animation: flash .3s infinite alternate; }
.sign.free { border-color: #fff; background: #fff; }
.sign.free::after { content: ""; position: absolute; inset: 4px; border-radius: 50%;
  background: repeating-linear-gradient(135deg, transparent 0 7px, #222 7px 9px); }
@keyframes flash { to { filter: brightness(1.3); transform: scale(1.04); } }
.speed { font-size: 40px; font-weight: 800; line-height: 1; }
.speed small { font-size: 13px; color: var(--dim); font-weight: 600; margin-left: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; background: var(--panel2); font-size: 13px; font-weight: 600; margin: 8px 6px 0 0; }
.chip.wish { background: rgba(91,155,255,.15); color: var(--blue); }
.reply { border: 1px solid var(--blue); background: rgba(91,155,255,.12); }
.reply q { display: block; font-style: italic; margin-bottom: 10px; }
.feed { display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 86%; padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: var(--panel2); font-size: 14px; }
.msg.new { animation: in .3s backwards; }
.msg b { display: block; font-size: 11px; color: var(--dim); margin-bottom: 1px; }
.msg.me { align-self: flex-end; border-radius: 14px 14px 4px 14px; background: rgba(54,211,153,.16); }
.msg.s2 b { color: var(--a2); } .msg.s3 b { color: var(--warn); }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
.stops { margin: 6px 0 0; padding: 0; list-style: none; }
.stops li { display: flex; gap: 10px; align-items: center; padding: 5px 0; color: var(--dim); font-size: 14px; }
.stops li i { width: 22px; height: 22px; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; flex: none; }
.stops li.done { opacity: .5; }
.stops li.now { color: var(--text); font-weight: 700; }
.stops li.now i { background: var(--grad); color: #fff; }
/* the map */
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; background: #17263C; }
.mapbox { position: absolute; inset: 0; }
.jobmap { position: relative; height: 46vh; min-height: 220px; max-height: 420px; margin: 4px 0 12px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); display: none; }
.jobmap.on { display: block; }
.mapbtns { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.mapmode { display: flex; padding: 3px; border-radius: 12px; background: rgba(23,28,44,.92); border: 1px solid var(--line); }
.mapmode button { width: auto; height: 34px; padding: 0 12px; border: 0; border-radius: 9px; font-size: 13px; font-weight: 700; color: #cdd3e4; background: none; }
.mapmode button.on { background: var(--grad); color: var(--sel); }
.compass { position: absolute; left: 12px; top: 44px; width: 40px; height: 40px; border-radius: 50%; background: rgba(23,28,44,.92); border: 1px solid var(--line); display: none; transition: opacity .3s; }
.compass.on { display: block; }
.compass svg { width: 100%; height: 100%; }
.mapbtns > button { width: 44px; height: 44px; border-radius: 12px; background: rgba(23,28,44,.92); border: 1px solid var(--line); font-size: 20px; font-weight: 700; }
.mapbtns > button.on { color: var(--blue); border-color: var(--blue); }
.mapinfo { position: absolute; left: 12px; right: 68px; bottom: 12px; background: rgba(23,28,44,.94); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: none; }
.mapinfo.on { display: block; }
.scale { position: absolute; left: 12px; top: 12px; font-size: 11px; color: #cdd3e4; font-weight: 700; text-shadow: 0 1px 2px #000; }
.scale i { display: block; height: 4px; border: 2px solid #cdd3e4; border-top: 0; margin-top: 2px; }
/* connecting */
.connect { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; padding: calc(40px + var(--safe-t)) 24px 24px; overflow-y: auto; }
.connect.off { display: none; }
.connect .logo { width: 72px; height: 72px; font-size: 42px; border-radius: 20px; margin-bottom: 18px; }
.connect h1 { margin: 0 0 6px; font-size: 26px; }
.connect p { color: var(--dim); margin: 0 0 18px; }
.pc { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 8px; width: 100%; text-align: left; }
.pc.sel { border-color: var(--a1); }
input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; width: 100%; outline: none; }
input:focus { border-color: var(--a1); }
.code { font-size: 28px; letter-spacing: .5em; text-align: center; font-weight: 800; }
.err { color: var(--bad); font-size: 14px; min-height: 20px; margin: 8px 0; }
.spin { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--a1); border-radius: 50%; animation: sp 1s linear infinite; display: inline-block; vertical-align: -4px; margin-right: 8px; }
@keyframes sp { to { transform: rotate(360deg); } }
/* 0.13: a list to pick from (designs, phone, ...) instead of tapping through */
.pick .card { padding: 14px 10px 10px; max-height: 72vh; overflow-y: auto; border-color: var(--rim); max-width: 520px; margin: 0 auto; }
.pick h3 { margin: 2px 12px 10px; font-size: 17px; }
.pick .ch { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 12px; border-radius: 16px; background: none; border: 0; color: var(--text); font: inherit; font-size: 16px; }
.pick .ch:active { background: var(--glass); }
.pick .ch .rd { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--dim); flex: none; }
.pick .ch.on .rd { border: 6px solid var(--a1); background: #fff; }
.pick .ch.on { font-weight: 700; }
/* 0.13: earnings (a week in bars), the ride book, timetables, progress */
.wk { display: flex; align-items: center; gap: 8px; }
.wk button { width: 36px; height: 36px; border-radius: 50%; background: var(--glass2); border: 1px solid var(--rim); color: var(--text); font-size: 18px; flex: none; }
.wk button:disabled { opacity: .3; }
.wk .grow { text-align: center; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; margin: 14px 0 4px; }
.bars button { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; background: none; border: 0; color: var(--dim); font: inherit; font-size: 11px; padding: 0; min-width: 0; }
.bars button i { display: block; width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px; background: var(--panel2); min-height: 4px; transition: height .4s var(--spring, ease); }
.bars button.has i { background: var(--a1); opacity: .55; }
.bars button.on i { opacity: 1; }
.bars button.on { color: var(--text); font-weight: 700; }
.chips3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.chips3 div { background: var(--panel2); border-radius: 14px; padding: 9px 10px; min-width: 0; }
.chips3 span { display: block; color: var(--dim); font-size: 11px; }
.chips3 b { font-size: 15px; white-space: nowrap; }
.ride { display: block; width: 100%; text-align: left; padding: 11px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; color: var(--text); font: inherit; }
.ride .top { display: flex; gap: 10px; align-items: baseline; }
.ride .top .grow { min-width: 0; }
.ride small { color: var(--dim); font-size: 12px; }
.ride .more { margin-top: 8px; display: none; }
.ride.open .more { display: block; }
.ride .more .kv { padding: 6px 0; font-size: 13px; }
.day { color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin: 14px 0 2px; }
.tt { margin-top: 10px; }
.tt div { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.tt div b { width: 66px; flex: none; white-space: nowrap; color: var(--dim); font-weight: 600; font-variant-numeric: tabular-nums; }
.row2 { display: flex; gap: 8px; margin-top: 10px; }
.row2 .btn { flex: 1; }
.tier { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.tier .ok { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--panel2); flex: none; }
.tier.done .ok { background: var(--a1); color: var(--sel); }
/* the card after a ride */
.done { position: fixed; inset: 0; z-index: 15; background: rgba(8,10,18,.72); display: none; align-items: flex-end; padding: 16px 16px calc(16px + var(--safe-b)); backdrop-filter: blur(6px); }
.done.on { display: flex; animation: in .35s; }
.done .card { width: 100%; padding: 20px; border-color: var(--a1); }
.done .k { color: var(--a2); font-size: 12px; font-weight: 800; letter-spacing: .1em; }
.done .m { font-size: 40px; font-weight: 800; margin: 6px 0; }
.done .stars { font-size: 26px; color: var(--warn); letter-spacing: 2px; }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
.pairs div { background: var(--panel2); border-radius: 10px; padding: 8px 10px; }
.pairs span { display: block; color: var(--dim); font-size: 11px; }
.toast { position: fixed; left: 16px; right: 16px; top: calc(12px + var(--safe-t)); z-index: 30; background: var(--bg2); box-shadow: 0 8px 24px rgba(0,0,0,.35); border: 1px solid var(--a1);
  border-radius: 14px; padding: 12px 14px; transform: translateY(calc(-100% - 40px - var(--safe-t))); transition: transform .3s; font-weight: 600; }
.toast.on { transform: none; }
/* ------------------------------------------------------------------ 0.11: the new look. Glass on a soft wallpaper made
   from the design's own colours (like Liquid Glass), big rounded shapes and bold numbers (like Material You),
   a floating tab bar with a sliding pill. The colours still come from the game phone's design. */
:root { --glass: rgba(23,28,44,.62); --glass2: rgba(23,28,44,.78); --rim: rgba(255,255,255,.12); --shine: rgba(255,255,255,.14);
  --blob1: rgba(255,46,126,.42); --blob2: rgba(255,138,61,.30); --blob3: rgba(91,155,255,.30); --pill: rgba(255,46,126,.18);
  --spring: cubic-bezier(.3,1.35,.5,1); --navh: 76px; }
html { background: var(--bg); }
html, body { background-color: var(--bg); }
body { background: transparent; }
body::before { content: ""; position: fixed; inset: -25%; z-index: -1; pointer-events: none;
  background: radial-gradient(38% 32% at 18% 12%, var(--blob1), transparent 72%), radial-gradient(42% 36% at 88% 34%, var(--blob2), transparent 72%),
    radial-gradient(48% 40% at 28% 92%, var(--blob3), transparent 72%), var(--bg);
  animation: drift 40s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(-5%, 4%) rotate(8deg) scale(1.06); } }
header { padding: calc(12px + var(--safe-t)) 18px 10px; }
.logo { border-radius: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 16px var(--pill); }
.title b { font-size: 19px; letter-spacing: -.01em; }
.money { padding: 7px 14px; border-radius: 18px; background: var(--glass); border: 1px solid var(--rim); box-shadow: inset 0 1px 0 var(--shine);
  -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); font-variant-numeric: tabular-nums; }
.page { padding: 4px 16px calc(var(--navh) + 26px + var(--safe-b)); }
.page.on { animation: pagein .35s var(--spring); }
@keyframes pagein { from { opacity: 0; transform: translateY(10px) scale(.99); } }
h2 { font-size: 22px; letter-spacing: -.01em; text-transform: none; color: var(--text); font-weight: 800; margin: 18px 4px 10px; }
.card, .stat, .offbar, .pc { background: var(--glass); border: 1px solid var(--rim); box-shadow: inset 0 1px 0 var(--shine), 0 10px 28px rgba(0,0,0,.16); }
.card { border-radius: 26px; padding: 18px; margin-bottom: 12px; }
.stat { border-radius: 22px; padding: 14px 16px; }
.stat b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stats { gap: 12px; margin-bottom: 12px; }
.offbar { border-radius: 18px; }
.card.hero { position: relative; overflow: hidden; border-radius: 30px; padding: 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 14px 34px var(--pill); }
.card.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(80% 60% at 15% 0%, rgba(255,255,255,.28), transparent 60%), radial-gradient(60% 50% at 100% 100%, rgba(0,0,0,.12), transparent 70%); }
.card.hero > * { position: relative; z-index: 1; }
.hero .pay { font-size: 40px !important; letter-spacing: -.03em; }
.pay { font-size: 26px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.btn { border-radius: 999px; padding: 15px; font-size: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 20px var(--pill); transition: transform .25s var(--spring), filter .2s; }
.btn:active { transform: scale(.96); }
.btn.ghost { background: var(--glass2); border: 1px solid var(--rim); box-shadow: inset 0 1px 0 var(--shine); }
.btn.red { box-shadow: none; }
.tag { padding: 3px 10px; border-radius: 999px; }
.bar { height: 8px; }
.speed { font-size: 54px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.ico { border-radius: 16px; background: var(--pill); }
.msg { border-radius: 20px 20px 20px 6px; background: var(--glass2); border: 1px solid var(--rim); }
.msg.me { border-radius: 20px 20px 6px 20px; }
.opt { padding: 15px 18px; border-bottom-color: var(--rim); }
.opt .v { padding: 6px 13px; }
/* Material switch for On/Off rows */

  cx.fillStyle = col; cx.beginPath(); cx.moveTo(sx + 1, sy - 30); cx.lineTo(sx + 20, sy - 24); cx.lineTo(sx + 1, sy - 17); cx.closePath(); cx.fill();
  cx.strokeStyle = "#fff"; cx.lineWidth = 1.5; cx.stroke();
}
function roundRect(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
function car(x, z, hd) {
  const [sx, sy] = scr(x, z);
  cx.save(); cx.translate(sx, sy); cx.rotate(hd);
  cx.fillStyle = "rgba(91,155,255,.25)"; cx.beginPath(); cx.arc(0, 0, 22, 0, 7); cx.fill();
  cx.fillStyle = "#5B9BFF"; cx.strokeStyle = "#fff"; cx.lineWidth = 2.5;
  cx.beginPath(); cx.moveTo(0, -17); cx.lineTo(12, 12); cx.lineTo(0, 6); cx.lineTo(-12, 12); cx.closePath(); cx.fill(); cx.stroke();
  cx.restore();
}
let tapAt = null;
function drawMapInfo() {
  followCar();
  const info = $("mapinfo"), j = S.job, tg = wantTarget || S.target;
  const away = p => S.car && S.car.ok ? ` · ${dist(Math.hypot(p.x - S.car.x, p.z - S.car.z))} ${t("awayT")}` : "";
  if (tapAt) {
    info.classList.add("on");
    info.innerHTML = `<div class="row"><div class="grow"><b>${t("targetQ")}</b><div class="muted">${away(tapAt).slice(3)}</div></div>
      <button class="btn" id="tg-set" style="width:auto;padding:10px 16px">${t("setTarget")}</button><button class="btn ghost" id="tg-no" style="width:auto;padding:10px 14px">✕</button></div>`;
    $("tg-set").onclick = () => setTarget(tapAt); $("tg-no").onclick = () => { tapAt = null; drawMapInfo(); };
  } else if (shownLine >= 0 && lines && lines.find(x => x.i === shownLine)) {
    const l = lines.find(x => x.i === shownLine), last = l.stops[l.stops.length - 1];
    info.classList.add("on");
    info.innerHTML = `<div class="row"><div class="grow"><div class="muted">${t("lineShown")}</div><b class="ell" style="display:block">${esc(l.number)} · ${esc(l.title)}</b>
      <div class="muted">${l.stops.length} ${t("stops")}${last.min !== undefined ? " · " + last.min + " " + t("minT") : ""}</div></div><button class="btn ghost" id="ln-x" style="width:auto;padding:10px 14px">✕</button></div>`;
    $("ln-x").onclick = () => { shownLine = -1; drawMapInfo(); };
  } else if (j) {
    info.classList.add("on");
    info.innerHTML = `<div class="muted">${esc(j.stageName)}</div><b class="ell" style="display:block">${esc((S.hud && S.hud.tripTo) || "")}</b>
      <div class="muted">${j.targetM != null ? dist(j.targetM) : ""}${j.timeLeft >= 0 ? " · " + clock(j.timeLeft) : ""} · ${j.sat} %</div>`;
  } else if (tg) {
    info.classList.add("on");
    info.innerHTML = `<div class="row"><div class="grow"><div class="muted">${t("targetT")}</div><b>${wantTarget ? t("targetWait") : t("targetSet")}</b><div class="muted">${away(tg).slice(3)}</div></div>
      <button class="btn ghost" id="tg-del" style="width:auto;padding:10px 14px">${t("targetDel")}</button></div>`;
    $("tg-del").onclick = () => { if (wantTarget) { wantTarget = null; store.set("target", ""); } else act("target", -1); if (S) S.target = null; drawOffbar(); drawMapInfo(); };
  } else info.classList.remove("on");
  redraw();
}
/* 0.13: a target from the map: now with the game, or kept until it runs */
function setTarget(p) {
  tapAt = null; buzz(25);
  if (offline) { wantTarget = { x: Math.round(p.x), z: Math.round(p.z) }; store.set("target", JSON.stringify(wantTarget)); toast(t("targetWait")); drawOffbar(); }
  else { act("target", tgArg(p.x, p.z)); S.target = { x: p.x, z: p.z }; toast(S.mode === "idle" ? t("targetSet") : t("targetJob")); }
  drawMapInfo();
}
/* screen (CSS pixels) -> world: scr() backwards */
function world(px, py) {
  const s = TS * Math.pow(2, mv.zoom) / WS, [ax, ay] = anchor(), c = Math.cos(rot), n = Math.sin(rot);
  const ux = px - ax, uy = py - ay, dx = ux * c - uy * n, dy = ux * n + uy * c;
  return { x: mv.x + dx / s, z: mv.z - dy / s };
}
/* touch: drag, pinch; the mouse: drag, wheel */
const ptrs = new Map();
let pinch0 = null;
let tap0 = null;
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); pinch0 = null; tap0 = ptrs.size === 1 ? { x: e.clientX, y: e.clientY, t: Date.now() } : null; });
cv.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (tap0 && Math.hypot(e.clientX - tap0.x, e.clientY - tap0.y) >= 10) tap0 = null;
  const s = TS * Math.pow(2, mv.zoom) / WS;
  if (ptrs.size === 1) {
    const ddx = (e.clientX - prev[0]) / s, ddy = (e.clientY - prev[1]) / s, c = Math.cos(rot), n = Math.sin(rot);
    mv.x -= ddx * c - ddy * n; mv.z += ddx * n + ddy * c;
    setFollow(false);
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch0) mv.zoom = Math.max(1, Math.min(9, pinch0.zoom + Math.log2(d / pinch0.d)));
    else pinch0 = { d, zoom: mv.zoom };
  }
  redraw();
});
const up = e => {
  ptrs.delete(e.pointerId); pinch0 = null;
  /* 0.13: a short tap without moving, on the map tab with no job: "target here?" */
  if (e.type === "pointerup" && tap0 && !ptrs.size && Date.now() - tap0.t < 400 && Math.hypot(e.clientX - tap0.x, e.clientY - tap0.y) < 10 && page === "map" && S && S.mode === "idle") {
    const r = cv.getBoundingClientRect(), w = world(e.clientX - r.left, e.clientY - r.top);
    if (w.x > -7600 && w.x < 13600 && w.z < 1100 && w.z > -11100) { tapAt = w; drawMapInfo(); }
  }
  tap0 = null;
};
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("wheel", e => { e.preventDefault(); mv.zoom = Math.max(1, Math.min(9, mv.zoom - e.deltaY / 300)); redraw(); }, { passive: false });
function setFollow(on) { follow = on; $("m-follow").classList.toggle("on", on); if (on && S) drawMapInfo(); }
$("m-follow").onclick = () => setFollow(true);
$("m-navi").onclick = () => setNavi(true);
$("m-plain").onclick = () => setNavi(false);
setNavi(navi);
$("m-in").onclick = () => { mv.zoom = Math.min(9, mv.zoom + 1); redraw(); };
$("m-out").onclick = () => { mv.zoom = Math.max(1, mv.zoom - 1); redraw(); };
window.addEventListener("resize", resize);

/* ------------------------------------------------------------------ the tabs */
/* 0.11: the pill under the chosen tab slides to it */
const navPill = document.createElement("i"); navPill.className = "pill"; document.querySelector("nav").prepend(navPill);
function movePill() {
  const b = document.querySelector("nav button.on"); if (!b) return;
  const side = getComputedStyle(document.querySelector("nav")).flexDirection === "column";
  if (side) { navPill.style.width = ""; navPill.style.height = b.offsetHeight + "px"; navPill.style.transform = `translateY(${b.offsetTop}px)`; }
  else { navPill.style.height = ""; navPill.style.width = b.offsetWidth + "px"; navPill.style.transform = `translateX(${b.offsetLeft}px)`; }
}
window.addEventListener("resize", movePill);
setTimeout(movePill, 50);
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  page = b.dataset.p;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".page").forEach(x => x.classList.toggle("on", x.id === "p-" + page));
  movePill();
  if (S) render();
  if (mapVisible()) resize();
});

/* ------------------------------------------------------------------ go */
if (host && code) start();
else if (served) /* the game's language for the code screen */
  fetch("/api/hello").then(r => r.json()).then(h => { DE = h.de ? 1 : 0; showConnect(); }).catch(() => showConnect());
else showConnect();
if (APP && APP.version) $("c-title").title = APP.version();
</script>
